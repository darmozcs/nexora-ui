server {
    listen 80;
    server_name _;

    # Se sirve detrás de Traefik bajo /nexora (ver /opt/infra/services/nexora).
    location = /nexora {
        return 301 /nexora/;
    }

    location /nexora/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /nexora/index.html;
    }
}
